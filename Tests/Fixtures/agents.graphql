"""
A point in time: RFC 3339 text in UTC with milliseconds, like 2026-10-06T14:49:10.690Z.
"""
scalar DateTime

"""Any JSON value. The keys of each object are in sorted order."""
scalar JSON

"""The kind of the layer that gave an agent."""
enum AgentLayerName {
  """The defaults folder of the host."""
  DEFAULTS

  """The user layer, for example the root settings folder of the host."""
  USER

  """The folder of the session. It wins over each other layer."""
  PROJECT

  """A cached marketplace. Each local layer wins over it."""
  MARKETPLACE
}

"""How serious a diagnostic is."""
enum AgentDiagnosticSeverity {
  """The agent loads with no change."""
  ADVISORY

  """The agent loads, possibly with a changed visibility."""
  WARNING

  """The agent does not load."""
  SKIP
}

"""
The layer that gave an agent. The highest layer that holds an agent wins it.
"""
type AgentLayer {
  """The kind of the layer."""
  name: AgentLayerName!

  """The absolute path of the root folder of the layer."""
  root: String!
}

"""
The marketplace that gave an agent. The URL of its source is never given.
"""
type AgentMarketplace {
  """The display id of the marketplace."""
  id: ID!

  """The commit of the snapshot, or null before the first install."""
  sha: String
}

"""One agent of the catalog of the session folder."""
type Agent {
  """The id of the agent: the name of its folder."""
  id: ID!

  """
  The name to show: the name key, for example Default for the default agent. The id when the key is absent.
  """
  name: String!

  """
  The absolute path of the AGENT.md of the agent, in the layer that gave it: <root>/<id>/AGENT.md, <root>/agents/<id>/AGENT.md, or <root>/AGENT.md for the default agent.
  """
  path: String!

  """
  The description key: when to use the agent. Null when the key is absent.
  """
  description: String

  """The model key, or null when the key is absent or empty."""
  model: String

  """The color key, or null when the key is absent."""
  color: String

  """The background key, or null when the key is absent."""
  background: Boolean

  """The Markdown body of the AGENT.md, not rendered."""
  body: String!

  """
  True when the model can see and start the agent: it has a description, and disable-model-invocation is not true.
  """
  isModelVisible: Boolean!

  """True when the agent is a slash command: user-invocable is not false."""
  isUserInvocable: Boolean!

  """
  True for the default agent, the root AGENT.md of a layer, with the id default.
  """
  isDefault: Boolean!

  """The layer that gave the agent."""
  layer: AgentLayer!

  """The marketplace that gave the agent, or null for a local layer."""
  marketplace: AgentMarketplace

  """
  Each finding of the load of the catalog that names this agent, for example a missing description.
  """
  diagnostics: [AgentDiagnostic!]!

  """
  Each unresolved conflict version of the file of the agent, for example a synced version from a different device. Empty when the file has no conflict.
  """
  conflicts: [AgentConflict!]!
}

"""
One finding of the load of the catalog. A finding never stops the load of another file.
"""
type AgentDiagnostic {
  """
  The code of the finding in UPPER_SNAKE, for example MISSING_DESCRIPTION, NOT_LOCAL, HIDDEN_COPY or DUPLICATE_DEFAULT. A client keys on the code, not on the message.
  """
  code: String!

  """How serious the finding is."""
  severity: AgentDiagnosticSeverity!

  """The id of the agent, or null when the folder name is not a valid id."""
  agent: ID

  """The absolute path of the file that the finding is about."""
  path: String!

  """The absolute path of the root folder of the layer of the file."""
  layerRoot: String!

  """The text of the finding, for a person."""
  message: String!
}

"""
One unresolved conflict version of the file of an agent. A change of the conflicts of an agent puts its id in changed of AgentChange.
"""
type AgentConflict {
  """The id of the version. The host finds the version again with this id."""
  id: ID!

  """
  The name of the device that saved the version, or null when it is not known.
  """
  deviceName: String

  """
  The time of the last change of the version, or null when it is not known.
  """
  modifiedAt: DateTime
}

"""
One reload of the catalog of the session folder that added, changed or removed an agent.
"""
type AgentChange {
  """The cursor that resumes after this change."""
  cursor: String!

  """The time of the reload that made the change."""
  at: DateTime!

  """
  The ids of the agents that the reload added. Query agent(id:) for each.
  """
  added: [ID!]!

  """
  The ids of the agents whose file or diagnostics the reload changed. Query agent(id:) for each.
  """
  changed: [ID!]!

  """
  The ids of the agents that the reload removed. A removed agent needs no query.
  """
  removed: [ID!]!
}

"""
A layer that a mutation can write. The defaults and marketplace layers are read-only.
"""
enum AgentWriteLayer {
  """The user layer, for all projects."""
  USER

  """The project layer, for this project only."""
  PROJECT
}

"""What removeAgent deleted."""
type RemoveAgentPayload {
  """The id of the deleted agent."""
  id: ID!

  """The layer that the mutation deleted the agent from."""
  layer: AgentWriteLayer!

  """
  The copy of the agent in another layer that stays, or null when no copy stays.
  """
  agent: Agent
}

"""The fields of addAgent."""
input AddAgentInput {
  """
  The id of the new agent: the name of its folder, or default for the default agent.
  """
  id: ID!

  """
  The name to show. Omit it for the id. Only the default agent can have a different name.
  """
  name: String

  """When to use the agent."""
  description: String!

  """The model key. Omit it for the default model."""
  model: String

  """The color key. Omit it for no color."""
  color: String

  """The background key. Omit it for no key."""
  background: Boolean

  """The Markdown body: the instructions. Omit it for no body."""
  body: String

  """The layer to write. Omit it for USER."""
  layer: AgentWriteLayer
}

"""
The fields of updateAgent. A field that you omit does not change, and each other key of the frontmatter stays.
"""
input UpdateAgentInput {
  """The id of the agent to change."""
  id: ID!

  """The new name to show. Omit it for no change."""
  name: String

  """The new description. Omit it for no change."""
  description: String

  """The new model key. Omit it for no change."""
  model: String

  """The new color key. Omit it for no change."""
  color: String

  """The new background key. Omit it for no change."""
  background: Boolean

  """The new Markdown body. Omit it for no change."""
  body: String

  """
  The layer, which must hold the agent. Omit it for the writable layer of the highest precedence that holds the agent.
  """
  layer: AgentWriteLayer
}

"""The fields of removeAgent."""
input RemoveAgentInput {
  """The id of the agent to delete."""
  id: ID!

  """
  The layer, which must hold the agent. Omit it for the writable layer of the highest precedence that holds the agent.
  """
  layer: AgentWriteLayer
}

type Query {
  """
  The cursor of the newest change of the catalog that this call reads, for changes(after:).
  """
  cursor: String!

  """Each agent of the catalog of the session folder, sorted by id."""
  agents: [Agent!]!

  """One agent of the catalog, or null when no agent has the id."""
  agent(
    """The id of the agent, as start agent takes it."""
    id: ID!
  ): Agent

  """
  Each finding of the load of the catalog, also of a file that gave no agent.
  """
  diagnostics: [AgentDiagnostic!]!
}

type Mutation {
  """
  Makes a new agent: its AGENT.md. Gives the agent that wins for the id, or AGENT_EXISTS, INVALID_AGENT or EXTERNAL_CLIENT_READ_ONLY.
  """
  addAgent(
    """The new agent."""
    input: AddAgentInput!
  ): Agent

  """
  Writes the given fields into the AGENT.md of an agent. Gives the agent that wins for the id, or NOT_FOUND, AGENT_READ_ONLY, INVALID_AGENT or EXTERNAL_CLIENT_READ_ONLY.
  """
  updateAgent(
    """The agent and its changes."""
    input: UpdateAgentInput!
  ): Agent

  """
  Deletes an agent and all its files from one layer. A copy in another layer stays. Gives NOT_FOUND, AGENT_READ_ONLY, INVALID_AGENT or EXTERNAL_CLIENT_READ_ONLY for an agent that cannot be deleted.
  """
  removeAgent(
    """The agent to delete."""
    input: RemoveAgentInput!
  ): RemoveAgentPayload
}

type Subscription {
  """
  One change for each reload that adds, changes or removes an agent. A cursor that cannot resume gives RESYNC_REQUIRED.
  """
  changes(
    """
    The cursor to resume after, from cursor or a change. Omit it for the new changes only.
    """
    after: String
  ): AgentChange!
}
